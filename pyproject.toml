[project]
name = "lorm"
version = "0.1.0"
description = "A research testbed for looped recurrent language models."
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub==0.36.2",
    "numpy>=1.26,<3",
    "transformers==4.57.6",
    "PyYAML==6.0.3",
    "wandb==0.30.0",
]

[project.optional-dependencies]
cpu = ["torch==2.9.1", "torchdata==0.11.0"]
gpu = ["torch==2.9.1", "torchdata==0.11.0"]
prep = ["zstandard==0.23.0", "pyarrow==21.0.0"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pypi", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
